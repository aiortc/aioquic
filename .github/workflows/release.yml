name: release

on:
  push:
    tags: ['*']

permissions:
  contents: read

jobs:

  build:
    uses: ./.github/workflows/build.yml

  publish:
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: pypi
      url: https://pypi.org/p/aioquic
    permissions:
      id-token: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist/
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
