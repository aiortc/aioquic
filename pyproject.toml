[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aioquic"
description = "An implementation of QUIC and HTTP/3"
readme = "README.rst"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [
    { name = "Jeremy Lainé", email = "jeremy.laine@m4x.org" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "certifi",
    "cryptography>=43.0.0",
    "pylsqpack>=1.0.0,<2.0.0",
    "pyopenssl>=24",
    "service-identity>=24.1.0",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.2.2",
]

[project.urls]
Homepage = "https://github.com/aiortc/aioquic"
Changelog = "https://aioquic.readthedocs.io/en/stable/changelog.html"
Documentation = "https://aioquic.readthedocs.io/"

[tool.check-manifest]
ignore = ["SECURITY.md"]

[tool.coverage.run]
source = ["aioquic"]

[tool.mypy]
disallow_untyped_calls = true
disallow_untyped_decorators = true
ignore_missing_imports = true
strict_optional = false
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # Pyflakes
    "W",  # pycodestyle
    "I",  # isort
]

[tool.ruff.lint.isort]
known-third-party = ["aioquic"]

[tool.setuptools.dynamic]
version = {attr = "aioquic.__version__"}
